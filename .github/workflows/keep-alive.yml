name: Keep Playground Backends Alive

on:
  schedule:
    # Runs twice per day: at 08:00 and 20:00 UTC (09:00 and 21:00 WAT)
    - cron: '0 8,20 * * *'
  workflow_dispatch: # Allows manual run anytime from GitHub Actions tab

jobs:
  ping-backends:
    name: Ping Playground APIs
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run keep-alive pinger
        run: node scripts/keep-alive.js
